<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            height: 100vh;
            margin: 0;
            background-color: rgb(224, 162, 195);
            cursor: none;
            overflow: hidden;
        }
         .contenido {
        position: absolute;
        background-color: rgb(226, 0, 121);
        border-radius: 50%;
        height: 50px;
        width:  50px;
        transform: translate(-50%, -50%);
        }
       
    </style>
</head>
<body> 
     <div class="contenido"></div>
     <script>

      for (let i = 0; i < 10; i++) {
      const div = document.createElement('div');
      div.classList.add('contenido');
      document.body.appendChild(div);
    }

    let estela = [];
    document.body.addEventListener('mousemove', (e) => {
      const objs = document.getElementsByClassName('contenido');
      estela.push([e.clientX, e.clientY]);
      if (estela.length > objs.length) estela.shift();
      for (let i = 0; i < objs.length; i++) {
        objs[i].style.top = estela[i][1] + 'px';
        objs[i].style.left = estela[i][0] + 'px';
      }
    });
     </script>
</body>
</html>
