    <title>Document</title>
    <style>
        body {
            margin: 0%;
            background-color: rgb(188, 118, 155);
        }
        .contenedor {
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-columns: 200px 200px 200px 200px 200px 200px 200px;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 20px;
        }

        .contenido {
            background-color: deeppink;
            border-radius: 20px;
            filter: grayscale(100%);
        }
        .contenido:hover{
            transition:1.05s;
            filter: grayscale(0%);
            scale: 1.02;
        }
        #primero{
           grid-column:1/2;
           grid-row: 1/3;
        }
      
        #tercero{
           grid-column:5/2;
           grid-row: 2/5;
        }
         #cuarto{
           grid-column: 7/8;
           grid-row: 1/3;
        }
         img{
            width: 100%;
            height: 100%;
         }

    </style>
</head>
<body>
    <div class="contenedor">
